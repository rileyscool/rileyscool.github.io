<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>riely.me</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Full-page blur overlay. Click or press Enter/Space to play music -->
    <div id="audio-overlay" class="audio-overlay" role="button" tabindex="0" aria-label="Play background music">
        <div class="overlay-content">
            <i class="fa-solid fa-music"></i>
            <p>click to enter</p>
        </div>
    </div>
    <!-- Snow background container (decorative) placed behind the card -->
    <div class="snow-container" aria-hidden="true"></div>
    <div class="card">
        <img src="this.png" alt="Profile Photo" class="profile-photo">
        <h1 class="name">riely</h1>

        <div class="time-container">
            <i class="fa-regular fa-clock"></i>
            <span id="akl-time">Loading time...</span>
            <span class="timezone"> (Auckland)</span>
        </div>

        <div class="links">
            <a href="https://www.last.fm/user/rielyy" target="_blank" class="link-btn lastfm" aria-label="Last.fm">
                <i class="fa-brands fa-lastfm"></i>
            </a>
            <a href="https://discord.com/users/933865035829227571" target="_blank" class="link-btn discord"
                aria-label="Discord">
                <i class="fa-brands fa-discord"></i>
            </a>
            <a href="mailto:riely@riely.me" class="link-btn email" aria-label="Email">
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>

        <!-- Audio controls (play/pause removed; keep mute button) -->
        <div class="audio-controls" aria-label="Background music controls">
            <button id="audio-mute" class="link-btn" aria-pressed="false" aria-label="Mute music">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>

        <!-- Background audio file: place a file named music.mp3 in the site root -->
        <audio id="bg-audio" src="music.mp3" loop preload="auto" autoplay muted></audio>
    </div>

    <script src="script.js"></script>
</body>

</html>
