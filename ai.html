
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #user-input {
            width: calc(100% - 22px);
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background-color: #282828;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #1db954;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out, transform 0.2s ease-in-out;
        }

        button:hover {
            background-color: #17a74a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Chat</h1>
        <div class="chat-box">
            <div id="chat-log"></div>
        </div>
        <input type="text" id="user-input" placeholder="Enter your prompt...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const userInput = document.getElementById("user-input").value;
            if (!userInput) return;

            const chatLog = document.getElementById("chat-log");
            chatLog.innerHTML += `<p><strong>You:</strong> ${userInput}</p>`;
            document.getElementById("user-input").value = "";

            try {
                const response = await fetch(`https://api.riely.me/aiSmart?prompt=${encodeURIComponent(userInput)}`);
                const data = await response.json();
                chatLog.innerHTML += `<p><strong>AI:</strong> ${data.response[0].generated_text}</p>`;
            } catch (error) {
                chatLog.innerHTML += `<p style="color: red;"><strong>Error:</strong> Unable to fetch response.</p>`;
            }
        }
    </script>
</body>
</html>
