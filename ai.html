
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Chat</h1>
        <div class="chat-box">
            <div id="chat-log"></div>
        </div>
        <input type="text" id="user-input" placeholder="Enter your prompt...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const userInput = document.getElementById("user-input").value;
            if (!userInput) return;

            const chatLog = document.getElementById("chat-log");
            chatLog.innerHTML += `<p><strong>You:</strong> ${userInput}</p>`;
            document.getElementById("user-input").value = "";

            try {
                const response = await fetch(`https://api.riely.me/ai?prompt=${encodeURIComponent(userInput)}`);
                const data = await response.text();
                chatLog.innerHTML += `<p><strong>AI:</strong> ${data}</p>`;
            } catch (error) {
                chatLog.innerHTML += `<p style="color: red;"><strong>Error:</strong> Unable to fetch response.</p>`;
            }
        }
    </script>
</body>
</html>
